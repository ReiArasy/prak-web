<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Step 3 - Fetch API & Async/Await</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 8px 16px; cursor: pointer; }
    .status { margin-top: 10px; font-weight: bold; color: #555; }
    .hasil-box {
      margin-top: 15px;
      padding: 12px;
      background: #eef7ff;
      border: 1px solid #b8daff;
      border-radius: 6px;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <h2>Simulasi Fetch API (Data Asinkron)</h2>
  <button id="btn-fetch">Ambil Data User dari API</button>
  <div id="status" class="status"></div>
  <div id="hasil" class="hasil-box" style="display: none;"></div>

  <script>
    const btnFetch = document.getElementById("btn-fetch");
    const statusEl = document.getElementById("status");
    const hasilEl = document.getElementById("hasil");

    // Fungsi asynchronous dengan try...catch (Modul 5.8.3 & 5.9.2)
    async function ambilDataUser() {
      statusEl.textContent = "Sedang menghubungi server JSONPlaceholder...";
      hasilEl.style.display = "none";

      try {
        // Mengambil data tiruan dari API publik
        const response = await fetch("https://jsonplaceholder.typicode.com/users/1");
        
        if (!response.ok) {
          throw new Error("Gagal mengambil data dari server");
        }

        // Parsing hasil JSON
        const user = await response.json();

        // Tampilkan hasil ke UI
        statusEl.textContent = "Data Berhasil Diterima!";
        hasilEl.style.display = "block";
        hasilEl.innerHTML = `
          <strong>Nama:</strong> ${user.name} <br>
          <strong>Email:</strong> ${user.email} <br>
          <strong>Kota:</strong> ${user.address.city} <br>
          <strong>Website:</strong> ${user.website}
        `;
        console.log("Data user lengkap:", user);
      } catch (error) {
        statusEl.textContent = "Terjadi Kesalahan: " + error.message;
        console.error(error);
      }
    }

    btnFetch.addEventListener("click", ambilDataUser);
  </script>
</body>
</html>
