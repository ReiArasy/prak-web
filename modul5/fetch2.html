<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Async & Fetch API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      font-size: 26px;
      line-height: 1.6;
    }
    h2 { font-size: 36px; }
    button {
      font-size: 24px;
      padding: 14px 24px;
      margin: 8px 10px 15px 0;
      cursor: pointer;
      border-radius: 8px;
    }
    pre {
      background: #f0f0f0;
      padding: 25px;
      border-radius: 8px;
      border: 3px solid #333;
      font-size: 26px;
      line-height: 1.6;
      font-family: Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>Modul 5: Promise, Async/Await & Fetch API</h2>
  <div>
    <button id="btn-promise">1. Jalankan Promise</button>
    <button id="btn-get">2. GET Request Fetch</button>
    <button id="btn-post">3. POST Request Fetch</button>
  </div>

  <pre id="output">Klik tombol di atas untuk melihat respon server...</pre>

  <script>
    const output = document.getElementById("output");

    // 5.8.2 Promise (Halaman 73)
    document.getElementById("btn-promise").addEventListener("click", () => {
      output.textContent = "Menjalankan Promise... tunggu 2 detik...";
      const ambilData = new Promise((resolve, reject) => {
        const berhasil = true;
        setTimeout(() => {
          if (berhasil) {
            resolve("Data berhasil diambil");
          } else {
            reject("Terjadi kesalahan");
          }
        }, 2000);
      });

      ambilData
        .then((hasil) => {
          console.log(hasil);
          output.textContent = "Hasil Promise: " + hasil;
        })
        .catch((error) => {
          console.log(error);
          output.textContent = "Error Promise: " + error;
        });
    });

    // 5.9.2 GET Request dengan Fetch menggunakan async/await (Halaman 74)
    async function ambilDataUser() {
      output.textContent = "Mengambil data user via GET Fetch...";
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users/1");
        const data = await response.json();
        console.log(data);
        output.textContent = "Data GET Diterima:\n" + JSON.stringify(data, null, 2);
      } catch (error) {
        console.log("Terjadi error:", error);
        output.textContent = "Terjadi error: " + error;
      }
    }
    document.getElementById("btn-get").addEventListener("click", ambilDataUser);

    // 5.9.3 POST Request dengan Fetch (Halaman 74)
    async function tambahUser() {
      output.textContent = "Mengirim data user via POST Fetch...";
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: "Budi Praktikan",
            email: "budi@example.com"
          })
        });
        const hasil = await response.json();
        console.log(hasil);
        output.textContent = "Data POST Berhasil Dibuat:\n" + JSON.stringify(hasil, null, 2);
      } catch (error) {
        console.log("Terjadi error:", error);
        output.textContent = "Terjadi error: " + error;
      }
    }
    document.getElementById("btn-post").addEventListener("click", tambahUser);
  </script>
</body>
</html>
